name: npm Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to npmjs.com. Leave false for a dry run."
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: proof-cli-switchboard
      - uses: actions/checkout@v4
        with:
          repository: proof-computer/switchboard-runtime-js
          path: switchboard-runtime-js
      - uses: actions/checkout@v4
        with:
          repository: proof-computer/switchboard-workflows-js
          path: switchboard-workflows-js
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: proof-cli-switchboard/pnpm-lock.yaml
          registry-url: https://registry.npmjs.org
      - run: npm ci
        working-directory: switchboard-runtime-js
      - run: npm run build
        working-directory: switchboard-runtime-js
      - run: npm ci
        working-directory: switchboard-workflows-js
      - run: npm run build
        working-directory: switchboard-workflows-js
      - run: pnpm install --frozen-lockfile
        working-directory: proof-cli-switchboard
      - run: pnpm typecheck
        working-directory: proof-cli-switchboard
      - run: pnpm test
        working-directory: proof-cli-switchboard
      - run: pnpm build
        working-directory: proof-cli-switchboard
      - run: node scripts/verify-package.mjs
        working-directory: proof-cli-switchboard
      - name: Prepare registry package metadata
        run: node scripts/prepare-npm-publish.mjs
        working-directory: proof-cli-switchboard
      - name: Verify split dependencies are published
        if: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          runtime_version="$(node -p "require('./package.json').dependencies['@proof-computer/switchboard-runtime']")"
          workflows_version="$(node -p "require('./package.json').dependencies['@proof-computer/switchboard-workflows']")"
          npm view "@proof-computer/switchboard-runtime@$runtime_version" version
          npm view "@proof-computer/switchboard-workflows@$workflows_version" version
        working-directory: proof-cli-switchboard
      - name: Check published version
        id: published
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          if npm view "$package_name@$package_version" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
        working-directory: proof-cli-switchboard
      - name: Publish dry run
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}
        run: npm publish --dry-run --access public
        working-directory: proof-cli-switchboard
      - name: Publish
        if: ${{ (github.event_name == 'push' || inputs.publish) && steps.published.outputs.published != 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "Missing NPM_ACCESS_TOKEN repository secret" >&2
            exit 1
          fi
          npm publish --provenance --access public
        working-directory: proof-cli-switchboard
